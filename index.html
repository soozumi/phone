<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yora's Phone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Nunito:wght@900&family=Oswald:wght@300;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e4e4e4;
  --body:#605e5f;
  --rim:#d6c8df;
  --lcd:#9dc3e2;
  --pix:'DotGothic16','MS Gothic','Osaka-Mono','Hiragino Kaku Gothic ProN',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:#222;font-family:'Roboto Mono',ui-monospace,Menlo,Consolas,monospace}
button,input,select,textarea{font-family:inherit}

#stage{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;gap:36px;padding:16px}
#phoneCol{flex:none;display:flex;flex-direction:column;align-items:center}
#box{position:relative}
#scaler{position:absolute;left:0;top:0;transform-origin:0 0}
.hint{margin:10px 0 0;font-size:13px;color:#777;text-align:center;max-width:430px;line-height:1.5}
.linkbtn{background:none;border:0;color:#7a63b5;font-size:13px;text-decoration:underline;cursor:pointer;margin-top:2px}

/* ---------- closed phone (traced from the mockup image) ---------- */
.closed{position:absolute;left:15px;top:6px;width:400px;height:839px;cursor:pointer;outline:none;
  transform-origin:50% 100%;transform:perspective(1500px) rotateX(0deg);
  transition:transform .42s cubic-bezier(.55,0,.85,.45),opacity .42s ease}
.closed.unfold{transform:perspective(1500px) rotateX(-88deg);opacity:.1}
.closed:focus-visible{filter:drop-shadow(0 0 8px #7a5bd6)}
.closed img{position:absolute;left:0;top:0;width:100%;height:100%;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
.c-disp{position:absolute;left:24.0%;top:40.98%;width:49.54%;height:23.75%;background:#acb7f4;overflow:hidden}
.c-disp canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated}

/* ---------- open phone ---------- */
.open{position:absolute;left:2px;top:0;width:425px;height:1090px;opacity:0;transform:translateY(10px) scale(.985);transition:opacity .3s ease,transform .3s ease}
.open.in{opacity:1;transform:none}
.upper,.lower{position:absolute;left:0;width:425px;background:var(--body);box-shadow:0 0 0 3px var(--rim),0 24px 40px rgba(0,0,0,.25)}
.upper{top:0;height:830px;border-radius:46px 46px 6px 6px/34px 34px 6px 6px}
.lower{top:856px;height:234px;border-radius:6px 6px 54px 54px}
.hinge{position:absolute;left:30px;top:828px;width:365px;height:30px;background:linear-gradient(#3a3839,#6c6a6b 50%,#3a3839);border-radius:4px;box-shadow:0 0 0 2px var(--rim);z-index:2}
.hinge::after{content:"";position:absolute;left:122px;top:4px;width:121px;height:22px;background:var(--rim);border-radius:4px;opacity:.85}
.sensor{position:absolute;left:84px;top:53px;width:20px;height:20px;background:#9a9a9a;border-radius:3px}
.speaker{position:absolute;left:178px;top:52px;width:70px;height:10px;background:#000;border-radius:6px}
.model{position:absolute;left:330px;top:55px;font:300 22px/1 'Oswald',sans-serif;color:#8b898a;letter-spacing:.5px}
.bezel{position:absolute;left:24px;top:85px;width:377px;height:633px;background:#000;border-radius:6px}
.aulogo{position:absolute;left:50px;top:682px;display:flex;align-items:baseline;gap:4px;color:#8d8d8d}
.aulogo b{font:900 24px/1 'Nunito',Arial,sans-serif}
.aulogo small{font-size:8px;letter-spacing:.3px}
.key{position:absolute;top:750px;width:88px;height:48px;background:#5f5e5f;border:2px solid #3b3a3b;border-radius:14px;color:#fff;
  display:flex;align-items:center;justify-content:center;font:300 34px/1 'Oswald',sans-serif;cursor:pointer;user-select:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.key:active,.dp:active,.callkey:active,.endkey:active{filter:brightness(1.25);transform:translateY(1px)}
.callkey,.endkey{position:absolute;top:70px;width:92px;height:46px;background:#4d4b4c;border:2px solid #343233;border-radius:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.callkey{left:34px}.endkey{right:34px}
.callkey svg,.endkey svg{width:30px;height:30px}
.dpad{position:absolute;left:134px;top:38px;width:156px;height:156px;border-radius:50%;background:#4b494a;border:2px solid #343233}
.dp{position:absolute;display:flex;align-items:center;justify-content:center;color:#c4c2c3;font-size:20px;cursor:pointer;user-select:none}
.dp.up{left:44px;top:4px;width:64px;height:40px}.dp.down{left:44px;bottom:4px;width:64px;height:40px}
.dp.left{left:4px;top:44px;width:40px;height:64px}.dp.right{right:4px;top:44px;width:40px;height:64px}
.dp.ok{left:48px;top:48px;width:56px;height:56px;border-radius:50%;background:#767475;border:2px solid #343233}
.kyo{position:absolute;left:0;right:0;top:204px;text-align:center;font:300 13px/1 'Oswald',sans-serif;letter-spacing:3px;color:#8b898a}

/* ---------- screen ---------- */
.screen{position:absolute;left:45px;top:100px;width:335px;height:572px;border-radius:6px;overflow:hidden;background:var(--lcd);
  font-family:var(--pix);color:#fff;font-size:20px;line-height:1.2;user-select:none}
.status{position:absolute;left:0;top:0;right:0;height:48px;z-index:2;display:flex;align-items:center;padding:0 5px;color:#444;
  background:repeating-linear-gradient(0deg,#a6c3df 0 2px,#9bbad8 2px 3px)}
.status .sl{display:flex;align-items:center;gap:5px}
.status .sm{margin-left:auto;margin-right:24px}
.status .sr{text-align:right;color:#4a4a4a}
.sd2{font-size:13px;line-height:14px}.st2{font-size:19px;line-height:20px}
.body{position:absolute;left:0;right:0;top:48px;bottom:0}
.bg-idle .body{background:var(--lcd)}
.bg-menu .body{background:linear-gradient(#6b8ef3,#5a83ec)}
.bg-white .body{background:#fff}
.content{position:absolute;left:0;right:0;top:0;bottom:0}
.hassofts .content{bottom:44px}
.softs{position:absolute;left:5px;right:5px;bottom:6px;height:32px;display:none;gap:6px}
.hassofts .softs{display:flex}
.soft{flex:1;text-align:center;line-height:28px;font-size:18px;color:#fff;background:#3f6ad9;border:2px solid #b6ccff;border-radius:3px;cursor:pointer;white-space:nowrap;overflow:hidden}
.soft.blank{visibility:hidden}
.bg-white .soft{background:#3f6ad9}

.hdr{height:40px;display:flex;align-items:center;gap:6px;padding:0 8px;font-size:22px;color:#fff;background:linear-gradient(#6a58cf,#a088ea);white-space:nowrap;overflow:hidden}
.hdr svg{width:26px;height:26px;flex:none}
.list{position:absolute;left:0;right:0;top:40px;bottom:0;overflow:hidden}
.list.foot-on{bottom:28px}
.foot{position:absolute;left:0;right:0;bottom:0;height:28px;line-height:28px;text-align:center;font-size:18px;border-top:2px solid rgba(255,255,255,.45)}
.row{height:44px;display:flex;align-items:center;padding:0 8px;font-size:22px;color:#fff;cursor:pointer}
.row.two{height:56px}
.row svg{width:28px;height:28px;flex:none;margin-right:8px}
.row .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:15px;opacity:.85;overflow:hidden;text-overflow:ellipsis}
.row .arr{margin-left:6px;font-size:16px}
.row.sel{background:linear-gradient(#a24fb5,#7a2f93);outline:2px solid #3b1a52;outline-offset:-2px}
.light .hdr{background:#fff;color:#334;border-bottom:3px solid #c9d4f5}
.light .row{color:#111}
.light .row.sel{background:#bcd3ff;outline:2px solid #3f6ad9}
.light .foot{border-top-color:#c9d4f5;color:#556}
.empty,.note{position:absolute;left:12px;right:12px;top:70px;text-align:center;font-size:21px;white-space:pre-line;line-height:1.35}
.note{top:80px}

/* menu grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);height:100%}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:4px;border:1px solid rgba(255,255,255,.35);font-size:17px;line-height:1.05;text-align:center;color:#fff;cursor:pointer}
.tile svg{width:54px;height:54px}
.tile.sel{background:#e3ecff;color:#000;outline:2px solid #11203f;outline-offset:-3px}
.tile.empty{position:static;cursor:default}

/* standby */
.stby{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#13202c;cursor:pointer}
.stby .sd{font-size:28px}
.stby .st{font:500 104px/1.05 'Oswald','Arial Narrow',sans-serif;letter-spacing:-2px}

/* message / contact card */
.mv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:8px 14px 8px;color:#333}
.mname{font-size:24px;color:#555;line-height:1.1}
.mtag{font-size:14px;color:#6a7a8a;margin-top:2px}
.avatar{width:96px;height:90px;margin:8px 0;border-radius:12px;flex:none}
.mbox{flex:1;min-height:0;width:100%;background:#dedede;padding:10px 12px;overflow:auto;display:flex;flex-direction:column;scrollbar-width:none}
.mbox::-webkit-scrollbar{display:none}
.mtext{margin:auto;text-align:center;font-size:19px;line-height:1.3;color:#2a2a2a;white-space:pre-wrap;word-break:break-word}
.mbox.empty{position:static;color:#777;font-size:19px;align-items:center;justify-content:center;text-align:center;white-space:normal}
.dim{color:#8a8a8a}
.mcount{position:absolute;right:18px;bottom:12px;font-size:13px;color:#667;background:rgba(222,222,222,.9);padding:0 3px}

/* forms */
.to{position:absolute;left:10px;top:46px;font-size:20px}
.ta{position:absolute;left:8px;right:8px;top:80px;bottom:8px;resize:none;border:3px solid #1c2f6e;border-radius:3px;background:#fff;color:#111;font:20px/1.25 var(--pix);padding:6px}
.form{position:absolute;left:8px;right:8px;top:46px}
.form label{display:block;font-size:16px;margin:10px 0 2px}
.form input{width:100%;font:20px var(--pix);padding:5px 6px;border:3px solid #1c2f6e;border-radius:3px;background:#fff;color:#111}
.form input:focus,.ta:focus,.ginput:focus{outline:3px solid #ffd54a}

/* google */
.gwrap{padding:8px 10px;color:#222}
.glogo{text-align:center;font:700 46px/1.1 'Trebuchet MS',Arial,sans-serif;margin:8px 0 12px}
.ginput{width:100%;font:20px var(--pix);padding:8px 12px;border:3px solid #9ab;border-radius:22px;color:#111;background:#fff}
.gh{margin:14px 4px 4px;font-size:15px;color:#667}
.grow{padding:8px 10px;font-size:19px;color:#111;border-bottom:1px solid #dde;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.grow.sel{background:#bcd3ff}

/* calculator */
.calc{position:absolute;inset:0;padding:6px}
.cdisp{height:74px;background:#e6efff;color:#111;border:3px solid #1c2f6e;border-radius:3px;text-align:right;padding:4px 8px;margin-bottom:6px;overflow:hidden}
.cdisp small{display:block;font-size:15px;height:16px;color:#556}
.cdisp div{font-size:36px;line-height:1.1;white-space:nowrap}
.ckeys{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;height:calc(100% - 82px)}
.ckey{display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;border:2px solid rgba(255,255,255,.5);border-radius:4px;cursor:pointer}
.ckey.sel{background:#e3ecff;color:#000;outline:2px solid #11203f;outline-offset:-3px}

/* clock / calendar */
.ckbig{text-align:center;font:500 54px/1.1 'Oswald',sans-serif;margin-top:4px}
.ckmon{text-align:center;font-size:20px;margin-bottom:4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:34px;padding:0 6px;text-align:center;align-items:center;font-size:19px}
.cw{font-size:15px;opacity:.8}.cd.sun{color:#ffb4b4}
.cd.today{background:#e3ecff;color:#000;border-radius:3px;line-height:28px}
.pedo{position:absolute;left:0;right:0;top:100px;text-align:center;font-size:22px}
.pbig{font:500 80px/1.1 'Oswald',sans-serif}

/* loading + boot */
.loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:22px}
.loading svg{width:64px;height:64px;animation:hg 1s steps(4) infinite}
@keyframes hg{to{transform:rotate(360deg)}}
.boot{position:absolute;inset:0;z-index:5;background:#fff;display:none;color:#333}
.boot.on{display:block}
.boot .au{position:absolute;left:0;right:0;top:170px;text-align:center;font:900 120px/1 'Nunito','Arial Rounded MT Bold',Arial,sans-serif;color:#eb5505}
.boot .by{position:absolute;left:0;right:0;top:300px;text-align:center;font:700 18px/1 Arial,sans-serif;color:#eb5505;letter-spacing:1px}
.boot .kyo2{position:absolute;left:0;right:0;bottom:70px;text-align:center;font:500 18px/1 'Oswald',sans-serif;letter-spacing:5px;color:#888}
.boot .bar{position:absolute;left:70px;right:70px;bottom:40px;height:8px;border:2px solid #ddd;border-radius:6px;overflow:hidden}
.boot .bar i{display:block;height:100%;width:0;background:#eb5505}
.boot.on .bar i{animation:load 1.5s ease-out forwards}
@keyframes load{to{width:100%}}

/* ---------- side panel ---------- */
.panel{flex:none;width:0;overflow:hidden;transition:width .35s ease;opacity:0}
.panel.show{width:min(540px,calc(100vw - 32px));opacity:1}
.pin{width:min(540px,calc(100vw - 32px));padding:4px 0 40px;font-size:15px}
.ptitle{font-size:20px;font-weight:500;margin:6px 0 10px}
.phead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.phead select{font-size:15px;padding:5px 8px;background:#fff;border:1px solid #aaa}
.pdate{text-align:center;font-size:34px;margin:22px 0 12px;cursor:pointer}
.pdate:hover{text-decoration:underline dotted}
.bub-row{display:flex;margin:10px 0}
.bub-row.me{justify-content:flex-end}
.bub{max-width:82%;padding:14px 18px;font-size:18px;line-height:1.35;background:#d9d9d9;position:relative;cursor:pointer;white-space:pre-wrap;word-break:break-word;color:#222}
.bub.sent{background:#c0c0c0;text-align:right}
.bub.cur{outline:2px solid #7a63b5}
.bmeta{font-size:12px;color:#777;margin-top:6px}
.btools{display:none;position:absolute;top:-13px;right:8px;gap:2px}
.bub:hover .btools{display:flex}
@media (hover:none){.btools{display:flex}}
.mini{font-size:12px;padding:2px 7px;border:1px solid #999;background:#f4f4f4;cursor:pointer;border-radius:3px}
.mini:hover{background:#fff}
.composer{margin:20px 0 0 auto;width:min(100%,460px);background:#c9c9c9;padding:14px;display:flex;flex-direction:column;gap:8px}
.composer input,.composer textarea,.gen input{font-size:14px;padding:7px 8px;border:1px solid #999;background:#fff;width:100%}
.composer textarea{resize:vertical}
.lbl2{font-size:13px;color:#555}
.seg{display:flex}
.seg button{flex:1;padding:7px;border:1px solid #888;background:#e8e8e8;cursor:pointer;font-size:14px}
.seg button.on{background:#7a63b5;color:#fff;border-color:#7a63b5}
.frow{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.frow>*{flex:1}
.frow label{font-size:12px;color:#555;display:flex;flex-direction:column;gap:3px}
.btn{padding:8px 12px;border:1px solid #6e58a8;background:#7a63b5;color:#fff;cursor:pointer;font-size:14px;text-align:center;flex:0 0 auto}
.btn:hover{background:#6a54a5}
.btn.warn{background:#b55a5a;border-color:#9a4646}
.btn.file{display:inline-block}
.crow,.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:#d9d9d9;margin:6px 0}
.srow .sq{flex:1;word-break:break-word}
.gen{margin-top:30px;padding-top:12px;border-top:1px solid #bbb}
.gen summary{cursor:pointer;font-size:15px;color:#555}
.gen .note{position:static;text-align:left;font-size:13px;color:#777;margin:8px 0;white-space:normal}

@media (max-width:920px){
  #stage{flex-direction:column;align-items:center;gap:12px}
  .panel.show{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  <div id="phoneCol">
    <div id="box">

<script>

/* ================= helpers ================= */
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Math.random().toString(36).slice(2,9);
const WD=['日','月','火','水','木','金','土'];
const isOk=k=>k==='ok'||k==='soft2';

/* ================= data ================= */
/* Nothing is saved: a refresh always returns the phone to the starting state below.
   To change the permanent content, edit defaults(). */
function defaults(){
  const c='c_inyeon';
  const m=(from,text)=>({id:uid(),cid:c,from,date:'2-27',time:'',text});
  return {
    settings:{showClock:true,date:'',time:''},
    contacts:[{id:c,name:'In Yeon',number:'',memo:''}],
    messages:[
      m('me','The canyon may be very hot and humid, just considering the location alone. Just keep that in mind when you decide on clothing.'),
      m('them','OK.'),
      m('them',"Don't care."),
      m('them','Thank you for the reminder'),
      m('them','Hope you are well, Yora'),
      m('them','What made you ask?')
    ],
    searches:[]
  };
}
let store=defaults();
function save(){}
const getContact=id=>store.contacts.find(c=>c.id===id);

/* ================= phone clock ================= */
function parseMD(s){const r=/^\s*(\d{1,2})\s*[-\/.]\s*(\d{1,2})\s*$/.exec(s||'');if(!r)return null;const m=+r[1],d=+r[2];return(m<1||m>12||d<1||d>31)?null:[m,d];}
function parseHM(s){const r=/^\s*(\d{1,2})\s*:\s*(\d{2})\s*$/.exec(s||'');if(!r)return null;const h=+r[1],mi=+r[2];return(h>23||mi>59)?null:[h,mi];}
function phoneNow(){
  const n=new Date();let y=n.getFullYear(),m=n.getMonth()+1,d=n.getDate(),hh=n.getHours(),mm=n.getMinutes();
  const sd=parseMD(store.settings.date),st=parseHM(store.settings.time);
  if(sd){m=sd[0];d=sd[1];}
  if(st){hh=st[0];mm=st[1];}
  return {y,m,d,hh,mm,wd:new Date(y,m-1,d).getDay()};
}
function defDate(){const n=phoneNow();return n.m+'-'+n.d;}
function defTime(){const t=parseHM(store.settings.time);return t?pad(t[0])+':'+pad(t[1]):'';}

/* ================= phone state / screen engine ================= */
const S={open:false,busy:false,booting:false,stack:[],ctx:{cid:null,msgId:null}};
const top=()=>S.stack[S.stack.length-1];

function renderScreen(full){
  if(full===undefined)full=true;
  const t=top();if(!t)return;
  const scr=$('#screen');
  scr.className='screen bg-'+(t.bg||'menu')+(t.theme?' '+t.theme:'')+(t.softs?' hassofts':'');
  $('#sbar').innerHTML=statusHTML();
  const c=$('#content');c.innerHTML='';
  t.render(c);
  const lb=(typeof t.labels==='function'?t.labels():t.labels)||['','',''];
  document.querySelectorAll('#softs .soft').forEach((el,i)=>{el.textContent=lb[i]||'';el.classList.toggle('blank',!lb[i]);});
  if(t.after)t.after(c);
  if(full)renderPanel();
}
function push(def){S.stack.push(def);renderScreen(true);}
function pop(){if(S.stack.length>1){S.stack.pop();renderScreen(true);}}
function popTo(kind){while(S.stack.length>1&&top().kind!==kind)S.stack.pop();renderScreen(true);}
function goHome(){S.stack=[standby()];renderScreen(true);}
function openWithLoading(def,ms){
  const l={kind:'loading',bg:'menu',softs:false,keys:false,render(el){el.innerHTML='<div class="loading">'+svg('hourglass')+'<div>Please wait...</div></div>';}};
  S.stack.push(l);renderScreen(true);
  setTimeout(()=>{const i=S.stack.indexOf(l);if(i>=0){S.stack[i]=def;renderScreen(true);}},ms||450);
}

function key(k){
  if(!S.open||S.booting)return;
  const t=top();if(!t||t.keys===false)return;
  if(t.onKey&&t.onKey(k))return;
  if(k==='soft1')pop();
  else if(k==='end'){if(S.stack.length<=1)closePhone();else goHome();}
  else if(k==='call')push(notice('Call history','contacts','No call history.'));
}

/* ---- generic screens ---- */
function listScreen(o){
  const d=Object.assign({bg:'menu',softs:true,sel:0,scroll:0,items:[],labels:['Back','Select','Menu']},o);
  const get=()=>typeof d.items==='function'?d.items():d.items;
  d.render=function(el){
    const items=get();d._items=items;
    if(d.sel>=items.length)d.sel=Math.max(0,items.length-1);
    const rows=items.map((it,i)=>'<div class="row'+(i===d.sel?' sel':'')+(it.sub!==undefined?' two':'')+'" data-i="'+i+'">'+(it.icon?svg(it.icon):'')+'<div class="lbl">'+esc(it.label)+(it.sub!==undefined?'<div class="sub">'+esc(it.sub)+'</div>':'')+'</div>'+(it.arrow?'<span class="arr">▶</span>':'')+'</div>').join('');
    el.innerHTML=hdrHTML(d.title,d.icon)+'<div class="list'+(d.footer?' foot-on':'')+'">'+(rows||'<div class="empty">'+esc(d.empty||'No data')+'</div>')+'</div>'+(d.footer?'<div class="foot">'+esc(typeof d.footer==='function'?d.footer():d.footer)+'</div>':'');
  };
  d.after=function(el){
    const c=el.querySelector('.list'),r=c&&c.querySelector('.row.sel');if(!c)return;
    c.scrollTop=d.scroll||0;
    if(r){
      if(r.offsetTop<c.scrollTop)c.scrollTop=r.offsetTop;
      else if(r.offsetTop+r.offsetHeight>c.scrollTop+c.clientHeight)c.scrollTop=r.offsetTop+r.offsetHeight-c.clientHeight;
    }
    d.scroll=c.scrollTop;
  };
  d.onKey=function(k){
    const n=(d._items||[]).length;
    if(k==='up'){if(n){d.sel=(d.sel-1+n)%n;renderScreen(false);}return true;}
    if(k==='down'){if(n){d.sel=(d.sel+1)%n;renderScreen(false);}return true;}
    if(isOk(k)){const it=d._items[d.sel];if(it&&it.action)it.action();return true;}
    if(k==='soft3'&&d.onMenu){d.onMenu();return true;}
    return false;
  };
  d.click=function(i){if(i===d.sel){const it=d._items[i];if(it&&it.action)it.action();}else{d.sel=i;renderScreen(false);}};
  return d;
}
function notice(title,icon,text){
  const t=top();
  return {kind:'notice',bg:'menu',softs:true,app:t?t.app:null,labels:['Back','',''],render(el){el.innerHTML=hdrHTML(title,icon)+'<div class="note">'+esc(text)+'</div>';}};
}
function confirmScreen(text,yes){
  const t=top();
  return {kind:'confirm',bg:'menu',softs:true,app:t?t.app:null,labels:['No','','Yes'],

    onKey(k){if(k==='soft3'){yes();return true;}return false;}};
}

function menuScreen(){
  const d={kind:'menu',bg:'menu',softs:true,sel:0,labels:['Back','Select','']};
  const items=()=>MENU;
  const act=i=>{const a=items()[i];if(a)openWithLoading(a.open(),450);};
  d.render=function(el){
    const it=items();
    let h='<div class="grid">';
    for(let i=0;i<9;i++){const a=it[i];h+=a?'<div class="tile'+(i===d.sel?' sel':'')+'" data-i="'+i+'">'+svg(a.icon)+'<span>'+esc(a.label)+'</span></div>':'<div class="tile empty"></div>';}
    el.innerHTML=h+'</div>';
  };
  d.onKey=function(k){
    const n=items().length;let s=d.sel;
    if(k==='left'&&s%3>0)s--;
    else if(k==='right'&&s%3<2)s++;
    else if(k==='up'&&s>=3)s-=3;
    else if(k==='down'&&s<6)s+=3;
    else if(isOk(k)){act(d.sel);return true;}
    else return false;
    d.sel=Math.min(s,n-1);renderScreen(false);return true;
  };
  d.click=function(i){if(!items()[i])return;if(i===d.sel)act(i);else{d.sel=i;renderScreen(false);}};
  return d;
}

function pickContact(){
  return listScreen({kind:'pick',app:'messages',title:'Send to',icon:'contacts',labels:['Back','Select',''],empty:'No contacts',
    items:()=>store.contacts.map(c=>({label:c.name,sub:c.number||undefined,icon:'contacts',action:()=>{S.ctx.cid=c.id;push(compose(c.id));}}))});

function openThread(cid){
  if(store.messages.some(m=>m.cid===cid))push(messageView(cid));else push(compose(cid));
}
function messageView(cid,startId){
  const d={kind:'thread',bg:'idle',app:'messages',softs:true,cid:cid,id:startId||null,labels:['Back','Reply','Menu']};
  const list=()=>store.messages.filter(m=>m.cid===cid);
  const cur=()=>{
    const l=list();if(!l.length)return null;
    let i=l.findIndex(m=>m.id===d.id);
    if(i<0){i=l.length-1;d.id=l[i].id;}
    return {m:l[i],i:i,n:l.length};
  };
  d.render=function(el){
    const c=cur(),ct=getContact(cid),name=ct?ct.name:'Unknown';
    S.ctx.cid=cid;
    if(!c){el.innerHTML='<div class="mv"><div class="mname">'+esc(name)+'</div>'+AVATAR+'<div class="mbox empty">No messages</div></div>';return;}
    S.ctx.msgId=c.m.id;
    const tag=(c.m.from==='me'?'Sent':'Received')+(c.m.date?' · '+c.m.date:'')+(c.m.time?' '+c.m.time:'');
    el.innerHTML='<div class="mv"><div class="mname">'+esc(name)+'</div><div class="mtag">'+esc(tag)+'</div>'+AVATAR+'<div class="mbox" id="mbox"><div class="mtext">'+esc(c.m.text)+'</div></div><div class="mcount">'+(c.i+1)+'/'+c.n+'</div></div>';
  };
  d.onKey=function(k){
    const c=cur();
    if(k==='left'||k==='right'){
      if(c){const l=list(),j=Math.max(0,Math.min(l.length-1,c.i+(k==='left'?-1:1)));d.id=l[j].id;renderScreen(true);}
      return true;
    }
    if(k==='up'||k==='down'){const b=$('#mbox');if(b)b.scrollTop+=(k==='up'?-40:40);return true;}
    if(isOk(k)){push(compose(cid));return true;}
    if(k==='soft3'){push(threadMenu(d));return true;}
    return false;
  };
  return d;
}
function threadMenu(view){
  return listScreen({kind:'tmenu',app:'messages',title:'Menu',icon:'mail',labels:['Back','Select',''],
    items:[
      {label:'Reply',action:()=>{S.stack.pop();push(compose(view.cid));}},
      {label:'Delete message',action:()=>{
        const id=view.id;store.messages=store.messages.filter(m=>m.id!==id);save();
        S.stack.pop();
        if(!store.messages.some(m=>m.cid===view.cid))S.stack.pop();else view.id=null;
        renderScreen(true);}},
      {label:'Delete thread',action:()=>{
        store.messages=store.messages.filter(m=>m.cid!==view.cid);save();
        S.stack.pop();S.stack.pop();renderScreen(true);}}
    ]});
}
function compose(cid){
  const d={kind:'compose',bg:'menu',app:'messages',softs:true,cid:cid,vals:{text:''},labels:['Back','Send','Clear']};
  d.render=function(el){
    const ct=getContact(cid);
    el.innerHTML=hdrHTML('New message','mail')+'<div class="to">To: '+esc(ct?ct.name:'Unknown')+'</div><textarea class="ta" data-bind="text" placeholder="Type a message">'+esc(d.vals.text)+'</textarea>';
  };
  d.after=function(el){const t=el.querySelector('textarea');if(t){t.focus({preventScroll:true});const l=t.value.length;try{t.setSelectionRange(l,l);}catch(e){}}};
  function send(){
    const text=d.vals.text.trim();if(!text)return;
    const m={id:uid(),cid:cid,from:'me',date:defDate(),time:defTime(),text:text};
    store.messages.push(m);save();S.ctx.cid=cid;S.ctx.msgId=m.id;
    S.stack.pop();
    while(S.stack.length>1&&top().kind==='pick')S.stack.pop();
    const t=top();
    if(t.kind==='thread'&&t.cid===cid){t.id=m.id;renderScreen(true);}else push(messageView(cid,m.id));
  }
  d.onKey=function(k){
    if(isOk(k)){send();return true;}
    if(k==='soft3'){d.vals.text='';renderScreen(false);return true;}
    return false;
  };
  return d;
}

function contactView(id){
  const d={kind:'cview',bg:'idle',app:'contacts',softs:true,labels:['Back','Message','Menu']};

    const c=getContact(id);if(!c){el.innerHTML='';return;}

  };

      {label:'Edit',action:()=>push(contactForm(id))},
      {label:'Delete',action:()=>{const c=getContact(id);push(confirmScreen('Delete '+(c?c.name:'this contact')+'?',()=>{deleteContact(id);popTo('contacts');}));}}
    ]}));return true;}

function contactForm(id){
  const c=id?getContact(id):null;
  const d={kind:'form',bg:'menu',app:'contacts',softs:true,f:0,labels:['Back','Save','Clear'],vals:{name:c?c.name:'',number:c?c.number:'',memo:c?c.memo:''}};
  const F=['name','number','memo'];
  d.render=function(el){
    el.innerHTML=hdrHTML(c?'Edit contact':'New contact','contacts')+'<div class="form"><label>Name</label><input data-bind="name" data-f="0" maxlength="40" value="'+esc(d.vals.name)+'"><label>Number</label><input data-bind="number" data-f="1" maxlength="30" value="'+esc(d.vals.number)+'"><label>Memo</label><input data-bind="memo" data-f="2" maxlength="80" value="'+esc(d.vals.memo)+'"></div>';
  };
  d.after=function(el){const i=el.querySelector('input[data-f="'+d.f+'"]');if(i){i.focus({preventScroll:true});}};
  d.onKey=function(k){
    if(k==='up'){d.f=Math.max(0,d.f-1);renderScreen(false);return true;}
    if(k==='down'){d.f=Math.min(2,d.f+1);renderScreen(false);return true;}
    if(isOk(k)){
      if(!d.vals.name.trim())return true;
      saveContact(id,d.vals.name,d.vals.number,d.vals.memo);
      popTo('contacts');return true;
    }
    if(k==='soft3'){d.vals[F[d.f]]='';renderScreen(false);return true;}
    return false;
  };
  return d;
}
function saveContact(id,name,number,memo){
  name=name.trim();number=(number||'').trim();memo=(memo||'').trim();
  if(id){const c=getContact(id);if(c){c.name=name;c.number=number;c.memo=memo;}}
  else store.contacts.push({id:uid(),name:name,number:number,memo:memo});
  save();
}
function deleteContact(id){
  store.contacts=store.contacts.filter(c=>c.id!==id);
  store.messages=store.messages.filter(m=>m.cid!==id);
  if(S.ctx.cid===id)S.ctx.cid=null;
  save();
}

function googleHome(){
  const d={kind:'google',bg:'white',app:'google',softs:true,sel:0,vals:{q:''},labels:['Back','Search','Menu']};
  const hist=()=>store.searches.slice().reverse().slice(0,6);
  d.render=function(el){
    const h=hist();
    el.innerHTML='<div class="gwrap"><div class="glogo"><span style="color:#4285f4">G</span><span style="color:#ea4335">o</span><span style="color:#fbbc05">o</span><span style="color:#4285f4">g</span><span style="color:#34a853">l</span><span style="color:#ea4335">e</span></div><input id="gq" class="ginput" data-bind="q" placeholder="Search" value="'+esc(d.vals.q)+'" maxlength="120" autocomplete="off"><div class="gh">Recent searches</div>'+
      (h.length?h.map((e,i)=>'<div class="grow'+(d.sel===i+1?' sel':'')+'" data-i="'+(i+1)+'">'+esc(e.q)+'</div>').join(''):'<div class="grow dim">No history</div>')+'</div>';
  };
  d.after=function(el){const i=el.querySelector('#gq');if(!i)return;if(d.sel===0)i.focus({preventScroll:true});else i.blur();};
  d.onKey=function(k){

    if(k==='down'){if(d.sel<n){d.sel++;renderScreen(false);}return true;}
    if(isOk(k)){
      if(d.sel===0)runSearch(d.vals.q,true);
      else{const e=hist()[d.sel-1];if(e)runSearch(e.q,false);}
      return true;
    }
    if(k==='soft3'){push(googleMenu());return true;}
    return false;
  };
  d.click=function(i){
    const e=hist()[i-1];if(!e)return;
    if(d.sel===i)runSearch(e.q,false);else{d.sel=i;renderScreen(false);}
  };
  return d;

  let h='<h2 class="ptitle">Contacts</h2>';
  h+=store.contacts.map(c=>'<div class="crow"><div><b>'+esc(c.name)+'</b><div class="dim">'+esc(c.number||'No number')+(c.memo?' · '+esc(c.memo):'')+'</div></div><div><button class="mini" data-act="cedit" data-id="'+c.id+'">Edit</button> <button class="mini" data-act="cdel" data-id="'+c.id+'">×</button></div></div>').join('')||'<p class="dim">No contacts yet.</p>';
  h+='<div class="composer"><div class="lbl2">'+(P.cedit?'Edit contact':'New contact')+'</div><input data-p="cname" placeholder="Name" value="'+esc(P.cname)+'"><input data-p="cnum" placeholder="Phone number" value="'+esc(P.cnum)+'"><input data-p="cmemo" placeholder="Memo (optional)" value="'+esc(P.cmemo)+'"><div class="frow"><button class="btn" data-act="csave">'+(P.cedit?'Save':'Add contact')+'</button>'+(P.cedit?'<button class="btn" data-act="ccancel">Cancel</button>':'')+'</div></div>';
  return h;
}
function googlePanel(){
  let h='<h2 class="ptitle">Search history</h2>';
  const rows=store.searches.slice().reverse();
  h+=rows.map(e=>'<div class="srow"><div class="sq">'+esc(e.q)+'</div><div class="dim">'+esc((e.date||'')+(e.time?' '+e.time:''))+'</div><button class="mini" data-act="gdel" data-id="'+e.id+'">×</button></div>').join('')||'<p class="dim">No search history yet.</p>';
  h+='<div class="composer"><div class="lbl2">Add a search (newest-added shows first)</div><input data-p="gq" placeholder="Search text" value="'+esc(P.gq)+'"><div class="frow"><input data-p="gdate" placeholder="Date, e.g. '+esc(defDate())+'" value="'+esc(P.gdate)+'"><input data-p="gtime" placeholder="Time (optional)" value="'+esc(P.gtime)+'"></div><div class="frow"><button class="btn" data-act="gadd">Add to history</button><button class="btn warn" data-act="gclear">Clear all</button></div></div>';
  return h;
}
function generalPanel(open){
  const st=store.settings;
  return '<details class="gen"'+(open?' open':'')+'><summary>Phone clock &amp; data</summary><p class="note">Leave blank to use the real date and time. Nothing here is saved: refreshing the page resets the phone.</p><div class="frow"><label>Phone date<input data-s="date" value="'+esc(st.date)+'" placeholder="M-D, e.g. 2-27"></label><label>Phone time<input data-s="time" value="'+esc(st.time)+'" placeholder="HH:MM"></label></div></details>';
}
function renderPanel(){
  const p=$('#panel'),t=top();
  const app=(S.open&&!S.booting&&t)?t.app:null;
  p.classList.toggle('show',!!app);
  if(!app)return;
  let h='';
  if(app==='messages')h=msgPanel();else if(app==='contacts')h=contactPanel();else if(app==='google')h=googlePanel();else if(app==='set')h='<h2 class="ptitle">Phone settings</h2>';
  $('#pin').innerHTML=h+generalPanel(app==='set');
}
function refreshAll(){save();renderScreen(true);}
function moveMsg(id,dir){
  const i=store.messages.findIndex(m=>m.id===id);if(i<0)return;
  const cid=store.messages[i].cid;let j=i+dir;
  while(j>=0&&j<store.messages.length&&store.messages[j].cid!==cid)j+=dir;
  if(j<0||j>=store.messages.length)return;
  const t=store.messages[i];store.messages[i]=store.messages[j];store.messages[j]=t;
}

$('#panel').addEventListener('input',e=>{
  const p=e.target.dataset.p,s=e.target.dataset.s;
  if(p)P[p]=e.target.value;
  if(s){store.settings[s]=e.target.value;save();tick();}
});
$('#panel').addEventListener('change',e=>{
  if(e.target.id==='pcid'){
    const cid=e.target.value;S.ctx.cid=cid;
    if(top()&&top().kind==='thread'){S.stack.pop();if(store.messages.some(m=>m.cid===cid))push(messageView(cid));else renderScreen(true);}
    else renderPanel();
  }
  if(e.target.id==='impfile'){
    const f=e.target.files&&e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{try{const o=JSON.parse(r.result);const d=defaults();store={settings:Object.assign(d.settings,o.settings||{}),contacts:o.contacts||[],messages:o.messages||[],searches:o.searches||[]};S.ctx={cid:null,msgId:null};refreshAll();tick();}catch(err){alert('That file could not be read.');}};
    r.readAsText(f);
  }
});
$('#panel').addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.tagName==='INPUT'||el.tagName==='SELECT')return;
  const act=el.dataset.act,id=el.dataset.id,t=top();
  switch(act){
    case 'selmsg':S.ctx.msgId=id;if(t&&t.kind==='thread')t.id=id;renderScreen(true);break;
    case 'dmsg':store.messages=store.messages.filter(m=>m.id!==id);refreshAll();break;
    case 'emsg':{const m=store.messages.find(x=>x.id===id);if(!m)break;const v=prompt('Edit message',m.text);if(v!==null&&v.trim()){m.text=v;refreshAll();}break;}
    case 'mvup':moveMsg(id,-1);refreshAll();break;
    case 'mvdn':moveMsg(id,1);refreshAll();break;
    case 'edate':{
      const i=store.messages.findIndex(m=>m.id===id);if(i<0)break;
      const old=store.messages[i].date,cid=store.messages[i].cid;
      const v=prompt('Date for this group of messages (e.g. 2-27)',old||'');if(v===null)break;
      for(let j=i;j<store.messages.length;j++){const m=store.messages[j];if(m.cid!==cid)continue;if(m.date!==old)break;m.date=v.trim();}
      refreshAll();break;}
    case 'who':P.from=el.dataset.v;renderPanel();break;
    case 'addmsg':{
      const cid=ctxCid();if(!cid){alert('Add a contact first.');break;}
      const text=P.text.trim();if(!text)break;
      const date=(P.date.trim()||defDate()),m={id:uid(),cid:cid,from:P.from,date:date,time:P.time.trim()||defTime(),text:text};
      store.messages.push(m);P.text='';P.date=P.date.trim()?date:'';S.ctx.cid=cid;S.ctx.msgId=m.id;
      if(t&&t.kind==='thread'&&t.cid===cid)t.id=m.id;
      refreshAll();break;}
    case 'clearthread':{const cid=ctxCid();if(cid&&confirm('Delete every message in this thread?')){store.messages=store.messages.filter(m=>m.cid!==cid);refreshAll();}break;}
    case 'gadd':{const q=P.gq.trim();if(!q)break;store.searches.push({id:uid(),q:q,date:P.gdate.trim()||defDate(),time:P.gtime.trim()||defTime()});P.gq='';refreshAll();break;}
    case 'gdel':store.searches=store.searches.filter(s=>s.id!==id);refreshAll();break;
    case 'gclear':if(confirm('Clear all search history?')){store.searches=[];refreshAll();}break;
    case 'cedit':{const c=getContact(id);if(c){P.cedit=id;P.cname=c.name;P.cnum=c.number;P.cmemo=c.memo;renderPanel();}break;}
    case 'ccancel':P.cedit=null;P.cname=P.cnum=P.cmemo='';renderPanel();break;
    case 'csave':if(!P.cname.trim())break;saveContact(P.cedit,P.cname,P.cnum,P.cmemo);P.cedit=null;P.cname=P.cnum=P.cmemo='';refreshAll();break;
    case 'cdel':{const c=getContact(id);if(c&&confirm('Delete '+c.name+' and their messages?')){deleteContact(id);refreshAll();}break;}
    case 'export':{
      const blob=new Blob([JSON.stringify(store,null,2)],{type:'application/json'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='yora-phone-data.json';document.body.appendChild(a);a.click();a.remove();break;}
    case 'reset':if(confirm('Reset all phone data to the starting state?')){store=defaults();S.ctx={cid:null,msgId:null};save();S.stack=[standby()];push(menuScreen());tick();}break;
  }
});

/* ================= closed phone display ================= */
function lcdThreshold(c){
  const x=c.getContext('2d'),d=x.getImageData(0,0,c.width,c.height),p=d.data;
  for(let i=3;i<p.length;i+=4)p[i]=p[i]>110?255:0;
  x.putImageData(d,0,0);
}
function renderOuter(){
  const cv=$('#lcd');
  const ctx=cv&&cv.getContext&&cv.getContext('2d');
  if(!ctx)return;
  const W=96,H=96,n=phoneNow();
  ctx.fillStyle='#aab4f4';ctx.fillRect(0,0,W,H);
  const ink=document.createElement('canvas');ink.width=W;ink.height=H;
  const ic=ink.getContext('2d');ic.fillStyle='#000';
  /* battery */
  ic.fillRect(2,3,13,1);ic.fillRect(2,12,13,1);ic.fillRect(2,3,1,10);ic.fillRect(14,3,1,10);
  [4,7,10].forEach(x=>ic.fillRect(x,5,2,6));
  /* antenna */
  [[17,3],[23,3],[18,4],[22,4],[19,5],[21,5]].forEach(q=>ic.fillRect(q[0],q[1],1,1));
  ic.fillRect(20,5,1,9);
  ic.fillRect(25,10,2,4);ic.fillRect(28,7,2,7);ic.fillRect(31,4,2,10);
  /* date: 7月 1日(木) */
  const base=41;
  const dateParts=sc=>[[String(n.m),'b'],['月','k'],[' ',2],[String(n.d),'b'],['日','k'],[' ',1],['('+WD[n.wd]+')','k']];
  const fnt=(t,sc)=>t==='b'?"700 "+Math.round(24*sc)+"px Oswald,'Arial Narrow',Impact,sans-serif":Math.round(14*sc)+"px DotGothic16,'MS Gothic','Hiragino Kaku Gothic ProN',monospace";
  const dateW=sc=>{let w=0;dateParts(sc).forEach(q=>{if(typeof q[1]==='number'){w+=q[1];return;}ic.font=fnt(q[1],sc);w+=ic.measureText(q[0]).width;});return w;};
  let sc=1;for(const t of [1,.9,.82,.75,.68]){sc=t;if(dateW(t)<=86)break;}
  let x=Math.max(3,Math.round((W-dateW(sc))/2)-1);
  ic.textBaseline='alphabetic';
  dateParts(sc).forEach(q=>{if(typeof q[1]==='number'){x+=q[1]*2;return;}ic.font=fnt(q[1],sc);ic.fillText(q[0],x,base);x+=ic.measureText(q[0]).width;});
  /* time: render big, crop to its ink box, stretch into the mockup's box */
  const tmp=document.createElement('canvas');tmp.width=900;tmp.height=340;
  const tc=tmp.getContext('2d');tc.fillStyle='#000';tc.textBaseline='alphabetic';
  tc.font="700 230px Oswald,Impact,'Arial Narrow',sans-serif";
  tc.fillText(pad(n.hh)+':'+pad(n.mm),10,290);
  const px=tc.getImageData(0,0,900,340).data;
  let x0=900,y0=340,x1=0,y1=0;
  for(let yy=0;yy<340;yy++)for(let xx=0;xx<900;xx++){if(px[(yy*900+xx)*4+3]>128){if(xx<x0)x0=xx;if(xx>x1)x1=xx;if(yy<y0)y0=yy;if(yy>y1)y1=yy;}}
  if(x1>x0&&y1>y0){ic.imageSmoothingEnabled=true;ic.drawImage(tmp,x0,y0,x1-x0+1,y1-y0+1,2,47,92,45);}
  lcdThreshold(ink);
  ctx.drawImage(ink,0,0);
}
function refreshOuter(){renderOuter();}
function tick(){
  renderOuter();
  if(S.open){
    $('#sbar').innerHTML=statusHTML();
    const t=top();if(t&&t.kind==='standby')renderScreen(false);
  }
}

/* ================= open / close / boot ================= */
const closedEl=$('#closed'),openEl=$('#openPhone');
function fit(){
  const W=430,H=S.open?1100:860;
  const s=Math.max(.35,Math.min(1,(window.innerHeight-80)/H,(window.innerWidth-32)/W));
  $('#box').style.width=(W*s)+'px';$('#box').style.height=(H*s)+'px';
  const sc=$('#scaler');sc.style.width=W+'px';sc.style.height=H+'px';sc.style.transform='scale('+s+')';
}
function updateHint(){
  $('#hint').innerHTML=S.open
    ?'Arrow keys move · <b>Enter</b> = Select · <b>1 / 2 / 3</b> = the three soft keys · <b>Esc</b> = Back · <b>End</b> = home. You can also click everything.'
    :'Click the phone to open it.';
  $('#foldBtn').hidden=!S.open;
}
function openPhone(){
  if(S.busy||S.open)return;S.busy=true;
  closedEl.classList.add('unfold');
  setTimeout(()=>{
    closedEl.hidden=true;closedEl.classList.remove('unfold');
    openEl.hidden=false;S.open=true;fit();updateHint();
    requestAnimationFrame(()=>openEl.classList.add('in'));
    boot();S.busy=false;
  },420);
}
function boot(){
  S.booting=true;S.stack=[standby()];renderScreen(true);
  $('#boot').classList.add('on');
  setTimeout(()=>{$('#boot').classList.remove('on');S.booting=false;renderPanel();},1800);
}
function closePhone(){
  if(S.busy||!S.open)return;S.busy=true;
  openEl.classList.remove('in');S.open=false;renderPanel();
  setTimeout(()=>{
    openEl.hidden=true;closedEl.hidden=false;closedEl.classList.add('unfold');
    fit();renderOuter();updateHint();
    requestAnimationFrame(()=>requestAnimationFrame(()=>closedEl.classList.remove('unfold')));
    S.busy=false;
  },260);
}
closedEl.addEventListener('click',openPhone);
closedEl.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPhone();}});
$('#foldBtn').addEventListener('click',closePhone);

/* ================= input wiring ================= */
const phoneEl=openEl;
phoneEl.addEventListener('mousedown',e=>{if(e.target.closest('[data-k]'))e.preventDefault();});
phoneEl.addEventListener('click',e=>{
  const k=e.target.closest('[data-k]');
  if(k){key(k.dataset.k);return;}
  const r=e.target.closest('#content [data-i]');
  if(r&&!S.booting){const t=top();if(t&&t.keys!==false&&t.click)t.click(+r.dataset.i);}
});
$('#screen').addEventListener('input',e=>{
  const b=e.target.dataset&&e.target.dataset.bind,t=top();
  if(b&&t&&t.vals)t.vals[b]=e.target.value;
});
$('#screen').addEventListener('focusin',e=>{
  const f=e.target.dataset&&e.target.dataset.f,t=top();
  if(f!==undefined&&t&&t.kind==='form')t.f=+f;
});
document.addEventListener('keydown',e=>{
  if(!S.open||S.booting)return;
  const t=e.target,tag=t.tagName;
  if(t.closest&&t.closest('#panel'))return;
  const inField=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT';
  const inScreen=inField&&t.closest&&t.closest('#screen');
  if(inField&&!inScreen)return;
  const cur=top();
  if(cur&&cur.onRawKey&&!inField&&cur.onRawKey(e)){e.preventDefault();return;}
  let k=null;
  if(inScreen){
    if(e.key==='Escape')k='soft1';
    else if(e.key==='Enter'&&(tag==='INPUT'||e.ctrlKey||e.metaKey))k='soft2';
    else if(tag==='INPUT'&&e.key==='ArrowUp')k='up';
    else if(tag==='INPUT'&&e.key==='ArrowDown')k='down';
  }else{
    const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Enter:'ok',Escape:'soft1',Backspace:'soft1','1':'soft1','2':'soft2','3':'soft3',End:'end'};
    k=m[e.key]||null;
  }
  if(k){e.preventDefault();key(k);}
});

/* ================= init ================= */
renderOuter();fit();updateHint();
window.addEventListener('resize',fit);
setInterval(tick,15000);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{renderOuter();});
})();
</script>
